<?xml version="1.0" encoding="UTF-8"?>
<!-- basic_shapes.svg without what LaserGRBL reads wrongly (F-34: point tokens of 3 characters or less,
     points without commas), so that LaserGRBL and FreeKerf (DIV-034) agree on every other shape -->
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="60mm" viewBox="0 0 100 60">
  <rect x="5" y="5" width="20" height="10" style="fill:none;stroke:#000000;stroke-width:0.1"/>
  <rect x="30" y="5" width="20" height="10" rx="3" style="fill:none;stroke:#000000;"/>
  <rect x="55" y="5" width="20" height="10" ry="2" style="fill:none;stroke:#000000;"/>
  <rect x="80" y="5" width="15" height="10" rx="4" ry="2" style="fill:none;stroke:#000000;"/>
  <circle cx="15" cy="35" r="8" style="fill:none;stroke:#000000;"/>
  <ellipse cx="40" cy="35" rx="10" ry="5" style="fill:none;stroke:#000000;"/>
  <line x1="55" y1="25" x2="75" y2="45" style="stroke:#000000;"/>
  <polyline points="80,25 85,35 90,25 95,35" style="fill:none;stroke:#000000;"/>
  <polygon points=" 5,50 15,58 25,50" style="fill:none;stroke:#000000;"/>
  <rect x="60" y="50" width="10" height="8" rx="3" ry="3" style="fill:none;stroke:#000000;"/>
  <polyline points="80,50 82,58 19,19 90,50" style="fill:none;stroke:#000000;"/>
</svg>
