# Machine-readable scope for the coverage report (human version: SCOPE.md).
#
# tier = "core"      -> counts toward the 100% line/branch target
# tier = "importers" -> phase 2: G-code generators and SVG/DXF/raster importers,
#                       same target, reported separately (SCOPE.md, "Importers")
# tier = "helper"    -> measured and reported, no target (embedded third-party or
#                       infrastructure code the core calls into)
#
# A file may be listed more than once with different ranges and tiers; a line
# belongs to the first entry (in this order) whose ranges contain it.
# ranges           -> optional [first, last] line ranges (inclusive) of the file that
#                     are in scope; omitted = the whole file
#
# Justified exclusions (unreachable or untestable lines inside the scope) are
# listed in exclusions.toml with their reason; the report shows coverage both
# raw and net of those exclusions.

[[file]]
path = "LaserGRBL/Core/GrblCore.cs"
tier = "core"

[[file]]
path = "LaserGRBL/Core/MarlinCore.cs"
tier = "core"

[[file]]
