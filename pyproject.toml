[project]
name = "lasergrbl-core-tests"
version = "0.1.0"
description = "Characterization test suite for the LaserGRBL core (C#), portable to a future Rust rewrite"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pythonnet>=3.0.5",
    "pyserial>=3.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lasergrbl_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
# a hung CLR call blocks signal delivery to the main thread; the thread method still fires
timeout_method = "thread"
addopts = "-ra -p no:faulthandler"
