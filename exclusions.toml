# Lines inside scope.toml that this suite cannot (or should not) execute, with the
# reason. The coverage report shows both raw coverage and coverage net of these.
# Line numbers refer to the source at bf15096. Categories:
#   ui        needs WinForms with a display (dialogs, MessageBox, Cursor); the
#             harness is headless by design
#   marshal   Control.BeginInvoke branch (needs a real Control and a message loop)
#   windows   Windows-only API (WMI)
#   platform  .NET Framework vs Mono difference
#   dead      no caller / unreachable by construction (see FINDINGS.md when relevant)
#   external  side effect outside the process (opens the browser)
#   race      only reachable through a thread race or an I/O failure that cannot
#             be forced deterministically
#   3d        branch on the SharpGL display list (3D preview, out of scope)
#   fixed-option  code behind a private option that is hard-coded and never changed
#             at run time (GCodeFromSVG: svgComments, svgNodesOnly, gcodeReduce,
#             svgConvertToMM; gcode: gcodeCompress, gcodeNoArcs, gcodeDragCompensation)
#   defensive guard against a failure of embedded third-party code that valid input
#             does not produce

